spring:
  cloud:
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
      - id: clients
        uri: ${CLIENT_URL:http://localhost:8088}
        predicates:
        - Path=/clients/**,/client/**
      - id: voitures
        uri: ${CAR_URL:http://localhost:8089}
        predicates:
        - Path=/voitures/**
eureka:
  client:
    enabled: false
